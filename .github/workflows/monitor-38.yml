name: Daily 3.8 TTS Monitor for Vertex AI

on:
  schedule:
    - cron: '30 3 * * *' # Runs daily at 03:30 UTC (9:00 AM IST)
  workflow_dispatch:      # Allows manual one-click trigger from GitHub Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check 3.8 models on Vertex AI
        id: check
        run: node scripts/check_38_status.js

      - name: Create Alert Issue if 3.8 is Live
        if: steps.check.outputs.is_live == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const models = '${{ steps.check.outputs.models }}';
            const issueTitle = '🚨 Gemini 3.8 Flash TTS is LIVE on Vertex AI!';
            
            // Check if an open issue already exists to avoid duplicate emails
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const existing = issues.data.find(i => i.title.includes('Gemini 3.8 Flash TTS is LIVE'));
            if (existing) {
              console.log('Alert issue already exists: #' + existing.number);
              return;
            }

            const body = [
              '## 🎉 Gemini 3.8 Flash TTS is Live on Vertex AI!',
              '',
              'Google Cloud Vertex AI has officially activated **Gemini 3.8 TTS** in `us-central1`!',
              '',
              `**Live Models Detected:** ${models}`,
              '',
              '### What to do now:',
              '1. Open your live app: [https://praveenmeruwa.github.io/gemini-tts-engine-1/](https://praveenmeruwa.github.io/gemini-tts-engine-1/)',
              '2. In the **TTS ENGINE** dropdown, select **Gemini 3.8 Flash TTS**.',
              '3. Hit **Generate Voiceover** to start creating stories with 3.8 using your remaining $300 Google Cloud credits!',
              '',
              '---',
              '*This notification was automatically dispatched by your Daily 3.8 Cloud Monitor.*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: body
            });
            console.log('Alert issue created successfully! Notification email dispatched.');
